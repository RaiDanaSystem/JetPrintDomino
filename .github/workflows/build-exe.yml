name: Build EXE
on:
  workflow_dispatch:
  push:
    branches: [ main ]
jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with: { dotnet-version: '8.0.x' }
      - run: dotnet test tests/DominoBridge.Tests -c Release
      - run: dotnet publish src/DominoBridge.App -c Release -o dist
      - uses: actions/upload-artifact@v4
        with:
          name: DominoAx150iBridge
          path: dist/DominoAx150iBridge.exe
